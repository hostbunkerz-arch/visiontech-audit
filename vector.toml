# 1. Источник данных: следим за текстовым файлом лога CRM заказчика
[sources.crm_logs]
type = "file"
include = ["/var/log/mock_logs/crm_access.log"]
read_from = "beginning"

# 2. Трансформация: превращаем сырую текстовую строку в структурированный JSON
[transforms.parse_json]
type = "remap"
inputs = ["crm_logs"]
source = """
. = parse_json!(.message)
"""

# 3. Точка назначения: пушим структурированный лог напрямую в ClickHouse
[sinks.clickhouse_output]
type = "clickhouse"
inputs = ["parse_json"]
endpoint = "http://clickhouse:8123"
database = "audit_logs"
table = "activity_stream"
auth.strategy = "basic"
auth.user = "auditor"
auth.password = "SecureCH_1787649352_Auth!" # Наш реальный сгенерированный пароль

# Настройка полей под нашу схему ClickHouse
skip_unknown_fields = true

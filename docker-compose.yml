version: '3.8'

networks:
  backend:
    driver: bridge

services:
  # ClickHouse: порты закрыты на 127.0.0.1
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: visiontech-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      - CLICKHOUSE_DB=audit_logs
      - CLICKHOUSE_USER=auditor
      - CLICKHOUSE_PASSWORD_FILE=/run/secrets/ch_password
    secrets:
      - ch_password
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql
      - ./clickhouse_config/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    networks:
      - backend
    restart: unless-stopped

  # Агент сбора логов Vector
  vector:
    image: timberio/vector:0.34.X-alpine
    container_name: visiontech-vector-agent
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - ./mock_logs:/var/log/mock_logs:ro # Читаем текстовую папку с логами
    networks:
      - backend
    depends_on:
      - clickhouse
    restart: unless-stopped

  # n8n: порты закрыты на 127.0.0.1
  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    container_name: visiontech-n8n-python
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD_FILE=/run/secrets/n8n_pass
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_PROCESS=main
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_EXPERIMENTAL_NODES_PYTHON=true
    secrets:
      - n8n_pass
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    networks:
      - backend
    depends_on:
      - clickhouse
      - ollama
    restart: unless-stopped

  # Локальный ИИ
  ollama:
    image: ollama/ollama:0.5.4
    container_name: visiontech-ollama-ai
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 8G
    networks:
      - backend
    restart: unless-stopped

  # Дашборд: ОСТАЕТСЯ ОТКРЫТЫМ ДЛЯ ДИРЕКТОРА
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: visiontech-streamlit
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
    volumes:
      - ./dashboard:/app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - backend
    depends_on:
      - clickhouse
    restart: unless-stopped

volumes:
  ch_data:
  n8n_data:
  ollama_data:

secrets:
  ch_password:
    file: ./secrets/clickhouse_password.txt
  n8n_pass:
    file: ./secrets/n8n_password.txt
